name: Update FRED Comparison Data

on:
  workflow_dispatch:
  schedule:
    - cron: "47 9 * * *"
      timezone: "Asia/Taipei"

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check FRED API key
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if ! printf '%s' "$FRED_API_KEY" | grep -Eq '^[a-z0-9]{32}$'; then
            echo "FRED_API_KEY不存在或格式錯誤；必須是32碼小寫英數字。"
            exit 1
          fi
          echo "FRED_API_KEY已設定且格式正確。"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Run FRED, comparison and signal tests
        run: |
          python -m unittest discover -s tests -p "test_fred*.py" -v
          python -m unittest discover -s tests -p "test_comparison.py" -v
          python -m unittest discover -s tests -p "test_signals.py" -v

      - name: Sync FRED API monthly series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/sync_fred.py

      - name: Build World Bank and FRED comparison
        run: python scripts/build_comparison.py

      - name: Build procurement trend signals
        run: python scripts/build_signals.py

      - name: Commit changed data
        run: |
          git config user.name "commodity-data-bot"
          git config user.email "commodity-data-bot@users.noreply.github.com"
          git add data/fred.json data/comparison.json data/signals.json data/status.json
          if git diff --cached --quiet; then
            echo "FRED comparison and signal data unchanged; no commit required."
          else
            git commit -m "Update FRED comparison and procurement signal data via API"
            git push
          fi
