name: Quality Check

on:
  pull_request:
    branches:
      - main
      - v2.3-project-foundation
      - v2.3-real-data-path
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run procurement platform tests
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile scripts/company_market_core.py scripts/company_market_row_safety.py scripts/company_market_preflight.py scripts/company_market_collector.py
          node --check assets/app.js
          node --check assets/app-core.js
          node --check assets/demo-market.js
          node --check assets/world-bank-live.js
          node --check assets/data-freshness.js
          node --check assets/source-comparison.js
          node --check assets/trend-signals.js
          node --check assets/supplier-rationality.js
          node --check assets/negotiation-report.js

      - name: Build GitHub Pages payload
        run: python scripts/prepare_site.py

      - name: Verify production source boundary
        run: |
          node --check _site/assets/app-core.js
          node --check _site/assets/data-freshness.js
          grep -q "v2.3.0" _site/index.html
          grep -q "World Bank 月度資料版 v2.3.0" _site/assets/world-bank-live.js
          grep -q './assets/app-core.js' _site/index.html
          grep -q './assets/data-freshness.js' _site/index.html
          if grep -q './assets/app.js' _site/index.html || test -f _site/assets/app.js; then
            echo "Development bootstrap app.js leaked into production"
            exit 1
          fi
          if grep -q 'demo-market.js' _site/index.html || test -f _site/assets/demo-market.js; then
            echo "Development Demo market fixture leaked into production"
            exit 1
          fi
          if grep -Eq 'mulberry32|Seeded Random Walk|const MATERIALS|Development Demo fixture' _site/assets/app-core.js; then
            echo "Demo market code leaked into production app-core.js"
            exit 1
          fi
          if grep -Eq 'validateAndCalc|f_supplierAsk|cmpGap' assets/demo-market.js; then
            echo "Should-Cost code leaked into demo-market.js"
            exit 1
          fi
          if grep -q "未連接任何外部市場資料來源" _site/index.html; then
            echo "Obsolete demo-only claim found in built site"
            exit 1
          fi
