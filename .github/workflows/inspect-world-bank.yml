name: Inspect World Bank Workbook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-inspection.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements-inspection.txt

      - name: Inspect official World Bank monthly workbook
        run: python scripts/inspect_world_bank.py

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: world-bank-workbook-inspection
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
