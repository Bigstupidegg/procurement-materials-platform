name: Update Procurement Trend Signals

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/build_signals.py
      - scripts/prepare_site.py
      - tests/test_signals.py
      - tests/test_signal_to_calculator.py
      - config/signal-rules.json
      - assets/trend-signals.css
      - assets/trend-signals.js
      - data/world-bank.json
      - data/comparison.json
      - .github/workflows/update-signals.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run procurement signal tests
        run: |
          python -m unittest discover -s tests -p "test_signals.py" -v
          python -m unittest discover -s tests -p "test_signal_to_calculator.py" -v

      - name: Check browser integration syntax
        run: node --check assets/trend-signals.js

      - name: Build procurement trend signals
        run: python scripts/build_signals.py

      - name: Commit changed signal data
        run: |
          git config user.name "commodity-data-bot"
          git config user.email "commodity-data-bot@users.noreply.github.com"
          git add data/signals.json
          if git diff --cached --quiet; then
            echo "Procurement signal data unchanged; no commit required."
          else
            git commit -m "Update procurement trend signals"
            git push
          fi

      - name: Prepare website files
        run: python scripts/prepare_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
