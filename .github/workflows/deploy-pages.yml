name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp -r data _site/
          touch _site/.nojekyll
          python - <<'PY'
          from pathlib import Path
          path = Path("_site/index.html")
          html = path.read_text(encoding="utf-8")

          favicon = '  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">\n'
          comparison_css = '  <link rel="stylesheet" href="./assets/source-comparison.css">\n'
          for marker in (favicon, comparison_css):
              href = marker.split('href="', 1)[1].split('"', 1)[0]
              if href not in html:
                  if '</head>' not in html:
                      raise SystemExit("找不到head結尾，無法加入網站資源")
                  html = html.replace('</head>', marker + '</head>', 1)

          original = '<script src="./assets/app.js"></script>'
          live = '<script src="./assets/world-bank-live.js"></script>'
          comparison = '<script src="./assets/source-comparison.js"></script>'
          if live not in html:
              if original not in html:
                  raise SystemExit("找不到app.js引用，無法加入World Bank前端")
              html = html.replace(original, original + '\n' + live, 1)
          if comparison not in html:
              html = html.replace(live, live + '\n' + comparison, 1)

          path.write_text(html, encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
