name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run procurement reporting integration tests
        run: |
          python -m unittest discover -s tests -p "test_supplier_rationality.py" -v
          python -m unittest discover -s tests -p "test_negotiation_report.py" -v
          python -m unittest discover -s tests -p "test_prepare_site.py" -v
          node --check assets/supplier-rationality.js
          node --check assets/negotiation-report.js

      - name: Prepare website files
        run: python scripts/prepare_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
