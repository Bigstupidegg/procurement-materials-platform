name: Update World Bank Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
      timezone: "Asia/Taipei"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Run World Bank, comparison and signal tests
        run: |
          python -m unittest discover -s tests -p "test_world_bank*.py" -v
          python -m unittest discover -s tests -p "test_comparison.py" -v
          python -m unittest discover -s tests -p "test_signals.py" -v

      - name: Sync World Bank Pink Sheet
        run: python scripts/sync_world_bank.py

      - name: Rebuild World Bank and FRED comparison
        run: python scripts/build_comparison.py

      - name: Build procurement trend signals
        run: python scripts/build_signals.py

      - name: Commit changed data
        run: |
          git config user.name "commodity-data-bot"
          git config user.email "commodity-data-bot@users.noreply.github.com"
          git add data/world-bank.json data/comparison.json data/signals.json data/status.json
          if git diff --cached --quiet; then
            echo "World Bank, comparison and signal data unchanged; no commit required."
          else
            git commit -m "Update World Bank commodity and procurement signal data"
            git push
          fi

      - name: Prepare website files
        run: python scripts/prepare_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
